[project]
name = "plaud-plus-mcp"
version = "0.6.0"
description = "Write-capable Plaud MCP. Official Plaud MCP is read-only; this one uses the web API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "Eidos AGI", email = "daniel@eidosagi.com" }
]
keywords = ["plaud", "mcp", "transcripts", "eidos-agi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications",
]
dependencies = [
  "plaud-tools>=0.8.2",
  "cryptography>=42",
  "keyring>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
plaud-plus-mcp = "plaud_plus_mcp.server:main"
plaud-plus = "plaud_plus_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/eidos-agi/plaud-plus-mcp"
Repository = "https://github.com/eidos-agi/plaud-plus-mcp"
Issues = "https://github.com/eidos-agi/plaud-plus-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plaud_plus_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
